spring:
  application:
    name: claims-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims_db}
    username: ${DB_USER:claims_user}
    password: ${DB_PASSWORD:claims_pass}
  jpa:
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway migrations, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
